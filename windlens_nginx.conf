# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 13.51.157.228 13.51.157.228.sslip.io _;
    return 301 https://$host$request_uri;
}

# Primary HTTPS Server (IP and sslip.io domain)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 13.51.157.228 13.51.157.228.sslip.io _;

    ssl_certificate /etc/letsencrypt/live/13.51.157.228.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.51.157.228.sslip.io/privkey.pem;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # =========================================================
    # 1. Central Gateway / Root Index Page
    # =========================================================
    location = / {
        root /home/ubuntu/portal;
        index index.html;
        try_files /index.html =404;
    }

    # =========================================================
    # 2. WindLens Application (/windlense & /windlens alias)
    # =========================================================
    location = /windlense {
        return 301 /windlense/;
    }

    location = /windlens {
        return 301 /windlense/;
    }

    location /windlens/ {
        return 301 /windlense/;
    }

    location ^~ /windlense/assets/ {
        alias /home/ubuntu/windlens/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /windlense/ {
        alias /home/ubuntu/windlens/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /windlense/index.html;
    }

    # WindLens API Reverse Proxies
    location ^~ /windlense/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(summary|timeseries|accuracy|forecast-history|data-quality) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /windlense/docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================================
    # 3. Noted AI Application (/noted)
    # =========================================================
    location = /noted {
        return 301 /noted/;
    }

    location ^~ /noted/assets/ {
        alias /home/ubuntu/Noted-AI/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /noted/ {
        alias /home/ubuntu/Noted-AI/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /noted/index.html;
    }

    # Noted AI Backend API Reverse Proxies
    location ^~ /noted/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ ^/api/(auth|notes|contacts|tasks|timeline|search|admin|integrations|agent) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /noted/api/docs {
        proxy_pass http://127.0.0.1:8001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fallback for /assets/
    location /assets/ {
        root /home/ubuntu/windlens/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================
    # 4. Background VPS Microservices & Management Tools
    # =========================================================
    location /pgadmin/ {
        proxy_pass http://127.0.0.1:5050/pgadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /polyxbot/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /portfolio/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /cockpit/ {
        proxy_pass https://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_verify off;
    }

    location /monitor/ {
        proxy_pass http://127.0.0.1:19999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
